<!DOCTYPE html>
<html lang="bs">

<head>

<meta charset="UTF-8">
    
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#00ff99">

<link rel="icon" href="icon-192.png">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA Sušara V4</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="topbar">


<div class="logo">

<h1>
SCADA SUŠARA
</h1>

<div class="subtitle">
Monitoring sistema za sušenje drveta
</div>

</div>



<div class="topinfo">


<div class="infoBox">

<span class="label">
Sistem
</span>

<span class="green">
ONLINE
</span>

</div>



<div class="infoBox">

<span class="label">
Sušare
</span>

<strong id="dryerCount">
0
</strong>

</div>



<div class="infoBox">

<span class="label">
Alarmi
</span>

<strong 
id="alarmCount"
class="green">

0

</strong>

</div>


</div>

<div class="infoBox">

<span class="label">
Broker
</span>

<span id="mqttStatus" class="red">
MQTT NIJE DOSTUPAN
</span>

</div>
    

</header>





<main>


<section 
id="chambers"
class="dryerGrid">

<!-- kartice se kreiraju iz cards.js -->

</section>





<section class="alarmPanel">


<h2>
ALARM PANEL
</h2>



<div id="alarmList">

Nema alarma

</div>


</section>


</main>






<footer>

SCADA v4 | ESP32 MQTT Monitoring

</footer>



<div id="settingsModal" class="modal">


<div class="modalContent">


<div class="modalHeader">

<h3>
Postavke sušare
</h3>


<button 
class="closeButton"
onclick="closeSettings()">
×
</button>

</div>



<label>
Debljina 1
</label>

<select id="thickness1">

    <option value="">Nema</option>

    <option value="27">Colara</option>

    <option value="32">32</option>

    <option value="38">Četvorka</option>

    <option value="48">Petica</option>

</select>



<label>
Debljina 2
</label>

<select id="thickness2">

    <option value="">Nema</option>

    <option value="27">Colara</option>

    <option value="32">32</option>

    <option value="38">Četvorka</option>

    <option value="48">Petica</option>

</select>


<label>
Početak sušenja
</label>

<input 
type="date"
id="startDate">



<div class="buttonRow">

<button
class="cancelButton"
onclick="closeSettings()">
Odustani
</button>


<button
class="saveButton"
onclick="saveSettings()">
Sačuvaj
</button>


</div>


</div>

</div>

<div id="updateBanner" class="updateBanner">

    <span id="updateText">
        Dostupna je nova verzija SCADA.
    </span>

    <button onclick="reloadSCADA()">
        Ažuriraj
    </button>

</div>

<div id="appVersion"></div>
    
<!-- Vanjske biblioteke -->

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>





<!-- SCADA moduli -->

<script src="config.js"></script>
<script src="settings.js"></script>
<script src="settingsUI.js"></script>
<script src="cards.js"></script>
<script src="gauges.js"></script>
<script src="charts.js"></script>
<script src="alarms.js"></script>
<script src="cycle.js"></script>
<script src="mqtt.js"></script>
<script src="app.js?v=44"></script>

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register(
        "./sw.js"
    );

}

</script>

</body>

</html>
