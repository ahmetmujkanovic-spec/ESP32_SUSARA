<!DOCTYPE html>
<html lang="bs">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SCADA v4 - Sušare</title>

<meta name="theme-color" content="#00c853">

<link rel="manifest" href="manifest.jsonn?v=3">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<header class="topbar">

<div class="logo">

<h1>SCADA v4</h1>

<div class="subtitle">
Monitoring sušara
</div>

</div>

<div class="topinfo">

<div class="infoBox">

<span class="label">MQTT</span>

<span id="mqttState" class="green">
Povezivanje...
</span>

</div>

<div class="infoBox">

<span class="label">ONLINE</span>

<span id="onlineCount">
0
</span>

</div>

<div class="infoBox">

<span class="label">ALARMI</span>

<span id="alarmCount">
0
</span>

</div>

<div class="infoBox">

<span class="label">Zadnje ažuriranje</span>

<span id="lastUpdate">
--
</span>

</div>

</div>

</header>


<main>

<div id="dryerGrid" class="dryerGrid">

<!-- Kartice će se automatski dodavati -->

</div>

</main>


<footer>

<div>

SCADA v4 • ESP32 • MQTT • HiveMQ Cloud

</div>

</footer>


<template id="dryerTemplate">

<div class="dryerCard">

<div class="cardHeader">

<div class="dryerTitle">

SUŠARA <span class="dryerNumber"></span>

</div>

<div class="stateBadge online">

ONLINE

</div>

</div>


<div class="gaugeArea">

<svg class="gauge" width="180" height="180">

<circle
cx="90"
cy="90"
r="70"
class="gaugeBackground"
/>

<circle
cx="90"
cy="90"
r="70"
class="gaugeValue"
/>

<text
x="90"
y="92"
text-anchor="middle"
class="gaugeTemp">

--

</text>

<text
x="90"
y="116"
text-anchor="middle"
class="gaugeUnit">

°C

</text>

</svg>

</div>


<div class="values">

<div class="row">

<span>Suhi</span>

<span class="suhi">
--
</span>

</div>

<div class="row">

<span>Vlažni</span>

<span class="vlazni">
--
</span>

</div>

<div class="row">

<span>ΔT</span>

<span class="delta">
--
</span>

</div>

</div>


<div class="trendBox">

<canvas class="trendCanvas"></canvas>

</div>


<div class="statusLine">

<span class="sensorStatus">

Sensors OK

</span>

<span class="lastSeen">

--

</span>

</div>

</div>

</template>


<script src="gauge.js"></script>

<script src="trend.js"></script>

<script src="mqtt.js"></script>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
  .then(() => console.log("PWA OK"))
  .catch(err => console.log(err));
}
</script>

</body>

</html>
