<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sušara HMI</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<!-- MQTT -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050505;
  color:#00ff99;
  text-align:center;
}

.header{
  background:#111;
  padding:12px;
  font-size:18px;
  border-bottom:1px solid #222;
}

/* STATUS */
.status{
  margin:10px;
  padding:10px;
  border-radius:10px;
  display:inline-block;
}

.ok{border:1px solid #00ff99; color:#00ff99;}
.warn{border:1px solid #ffcc00; color:#ffcc00;}
.bad{border:1px solid #ff3333; color:#ff3333;}

/* GRID */
.grid{
  display:grid;
  gap:12px;
  padding:12px;
}

.card{
  background:#111;
  border-radius:12px;
  padding:15px;
}

.label{
  font-size:14px;
  color:#888;
}

.value{
  font-size:42px;
  margin-top:6px;
}

/* SUŠARA ANIMACIJA */
.dryer{
  width:280px;
  height:160px;
  margin:15px auto;
  border-radius:12px;
  background:#1a1a1a;
  border:2px solid #333;
  position:relative;
  overflow:hidden;
  transition:0.4s;
}

.heat{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,255,100,0.05);
  transition:0.4s;
}

.wave{
  position:absolute;
  width:200%;
  height:200%;
  background:linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
  animation:move 2.5s linear infinite;
  opacity:0.2;
}

@keyframes move{
  from{transform:translate(-20%, -20%) rotate(0deg);}
  to{transform:translate(0,0) rotate(360deg);}
}

/* BAR */
.bar{
  width:280px;
  height:10px;
  margin:10px auto;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  transition:0.3s;
}

/* FOOTER */
.footer{
  font-size:12px;
  color:#444;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">🏭 SUŠARA HMI DASHBOARD</div>

<div id="status" class="status warn">CONNECTING...</div>

<!-- SUŠARA -->
<div class="dryer" id="dryer">
  <div class="heat" id="heat"></div>
  <div class="wave"></div>
</div>

<!-- DATA -->
<div class="grid">

  <div class="card">
    <div class="label">SUHI</div>
    <div class="value" id="suhi">--</div>
  </div>

  <div class="card">
    <div class="label">VLAŽNI</div>
    <div class="value" id="vlazni">--</div>
  </div>

  <div class="card">
    <div class="label">DELTA</div>
    <div class="value" id="delta">--</div>
  </div>

</div>

<!-- BAR -->
<div class="bar">
  <div class="fill" id="fill"></div>
</div>

<!-- GRAF -->
<div class="card" style="margin:12px;">
  <div class="label">TREND TEMPERATURE</div>
  <canvas id="chart" height="120"></canvas>
</div>

<div class="footer">HiveMQ Cloud SCADA</div>

<script>

/* ================= MQTT ================= */

const client = mqtt.connect(
"wss://f061290ac3f24bb7a4bd389b716bddc6.s1.eu.hivemq.cloud:8884/mqtt",
{
  username:"esp32",
  password:"1234Aaaa",
  reconnectPeriod:2000
});

let suhi = 0;
let vlazni = 0;

/* STATUS UI */
function setStatus(txt, cls){
  let s = document.getElementById("status");
  s.innerHTML = txt;
  s.className = "status " + cls;
}

client.on("connect", () => {
  setStatus("CONNECTED","ok");

  client.subscribe("susara/suhi");
  client.subscribe("susara/vlazni");
  client.subscribe("susara/delta");
});

client.on("reconnect", () => setStatus("RECONNECTING","warn"));
client.on("error", () => setStatus("MQTT ERROR","bad"));

/* ================= ANIMACIJA ================= */

function updateAnimation(delta){

  let dryer = document.getElementById("dryer");
  let heat = document.getElementById("heat");
  let fill = document.getElementById("fill");

  let pct = Math.min((delta/20)*100,100);
  fill.style.width = pct + "%";

  if(delta < 3){
    dryer.style.borderColor = "#ff3333";
    heat.style.background = "rgba(255,0,0,0.12)";
  }
  else if(delta < 8){
    dryer.style.borderColor = "#ffcc00";
    heat.style.background = "rgba(255,200,0,0.08)";
  }
  else{
    dryer.style.borderColor = "#00ff99";
    heat.style.background = "rgba(0,255,100,0.08)";
  }
}

/* ================= GRAF ================= */

const ctx = document.getElementById("chart").getContext("2d");

let labels = [];
let suhiArr = [];
let vlazniArr = [];

const chart = new Chart(ctx, {
  type:"line",
  data:{
    labels:labels,
    datasets:[
      {
        label:"Suhi",
        data:suhiArr,
        borderColor:"#00ff99",
        tension:0.3
      },
      {
        label:"Vlažni",
        data:vlazniArr,
        borderColor:"#ffcc00",
        tension:0.3
      }
    ]
  },
  options:{
    responsive:true,
    animation:false,
    scales:{
      x:{display:false}
    }
  }
});

function addPoint(){
  let t = new Date().toLocaleTimeString();

  labels.push(t);
  suhiArr.push(suhi);
  vlazniArr.push(vlazni);

  if(labels.length > 60){
    labels.shift();
    suhiArr.shift();
    vlazniArr.shift();
  }

  chart.update();
}

/* ================= MQTT DATA ================= */

client.on("message", (topic, msg) => {

  let v = parseFloat(msg.toString());

  if(topic === "susara/suhi"){
    suhi = v;
    document.getElementById("suhi").innerHTML = v.toFixed(1) + " °C";
  }

  if(topic === "susara/vlazni"){
    vlazni = v;
    document.getElementById("vlazni").innerHTML = v.toFixed(1) + " °C";
  }

  if(topic === "susara/delta"){
    document.getElementById("delta").innerHTML = v.toFixed(1) + " °C";
    updateAnimation(v);
  }

  addPoint();
});

/* ================= PWA ================= */

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
