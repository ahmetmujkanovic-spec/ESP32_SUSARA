<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sušara Animated HMI</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050505;
  color:#00ff99;
  text-align:center;
}

/* HEADER */
.header{
  background:#111;
  padding:12px;
  font-size:18px;
  border-bottom:1px solid #222;
}

/* STATUS */
.status{
  margin:10px;
  padding:10px;
  border-radius:10px;
  font-size:16px;
  display:inline-block;
}

.ok{border:1px solid #00ff99; color:#00ff99;}
.warn{border:1px solid #ffcc00; color:#ffcc00;}
.bad{border:1px solid #ff3333; color:#ff3333;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:12px;
}

/* CARDS */
.card{
  background:#111;
  border-radius:12px;
  padding:15px;
}

/* BIG VALUES */
.value{
  font-size:42px;
  margin-top:8px;
}

/* ===== SUŠARA ANIMACIJA ===== */

.dryer{
  width:280px;
  height:160px;
  margin:15px auto;
  border-radius:12px;
  position:relative;
  background:#1a1a1a;
  border:2px solid #333;
  overflow:hidden;
  transition:0.5s;
}

/* toplinski sloj */
.heat{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,255,100,0.05);
  transition:0.5s;
}

/* “sušenje valovi” */
.wave{
  position:absolute;
  width:200%;
  height:200%;
  background:linear-gradient(
    45deg,
    transparent 40%,
    rgba(255,255,255,0.05) 50%,
    transparent 60%
  );
  animation:move 2.5s linear infinite;
  opacity:0.2;
}

@keyframes move{
  from{transform:translate(-20%, -20%) rotate(0deg);}
  to{transform:translate(0,0) rotate(360deg);}
}

/* PROGRESS BAR */
.bar{
  width:280px;
  height:10px;
  background:#222;
  border-radius:10px;
  margin:10px auto;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  transition:0.4s;
}

/* DRYING ICON EFFECT */
.dots{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  letter-spacing:4px;
  opacity:0.5;
}

.pulse{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}

.footer{
  font-size:11px;
  color:#444;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">🏭 SUŠARA - ANIMATED HMI (MQTT)</div>

<div id="status" class="status warn">CONNECTING...</div>

<!-- ANIMIRANA SUŠARA -->
<div class="dryer" id="dryer">

  <div class="heat" id="heat"></div>
  <div class="wave"></div>

  <div class="dots" id="dots">• • •</div>

</div>

<!-- DATA -->
<div class="grid">

  <div class="card">
    <div>SUHI</div>
    <div class="value" id="suhi">--</div>
  </div>

  <div class="card">
    <div>VLAŽNI</div>
    <div class="value" id="vlazni">--</div>
  </div>

  <div class="card">
    <div>DELTA</div>
    <div class="value" id="delta">--</div>
  </div>

</div>

<div class="bar">
  <div class="fill" id="fill"></div>
</div>

<div class="footer">HiveMQ Cloud SCADA</div>

<script>

/* ================= MQTT ================= */

const client = mqtt.connect(
"wss://f061290ac3f24bb7a4bd389b716bddc6.s1.eu.hivemq.cloud:8884/mqtt",
{
  username:"esp32",
  password:"1234Aaaa"
});

client.on("connect", () => {
  setStatus("CONNECTED","ok");

  client.subscribe("susara/suhi");
  client.subscribe("susara/vlazni");
  client.subscribe("susara/delta");
});

client.on("reconnect", () => setStatus("RECONNECTING","warn"));
client.on("error", () => setStatus("MQTT ERROR","bad"));

/* ================= UI STATUS ================= */

function setStatus(text,type){
  let s = document.getElementById("status");
  s.innerHTML = text;
  s.className = "status " + type;
}

/* ================= ANIMATION ENGINE ================= */

function updateAnimation(delta){

  let dryer = document.getElementById("dryer");
  let heat = document.getElementById("heat");
  let dots = document.getElementById("dots");
  let fill = document.getElementById("fill");

  let pct = Math.min((delta/20)*100,100);
  fill.style.width = pct + "%";

  /* DRYING STATE */
  if(delta < 3){
    dryer.style.borderColor = "#ff3333";
    heat.style.background = "rgba(255,0,0,0.12)";
    dots.classList.remove("pulse");
    setStatus("VLAGA VISOKA","bad");
  }
  else if(delta < 8){
    dryer.style.borderColor = "#ffcc00";
    heat.style.background = "rgba(255,200,0,0.08)";
    dots.classList.add("pulse");
    setStatus("SUŠENJE U TOKU","warn");
  }
  else{
    dryer.style.borderColor = "#00ff99";
    heat.style.background = "rgba(0,255,100,0.08)";
    dots.classList.add("pulse");
    setStatus("SUŠENJE OK","ok");
  }
}

/* ================= MQTT DATA ================= */

let suhi = 0;
let vlazni = 0;

client.on("message", (topic, msg) => {

  let v = parseFloat(msg.toString());

  if(topic==="susara/suhi"){
    suhi = v;
    document.getElementById("suhi").innerHTML = v.toFixed(1) + " °C";
  }

  if(topic==="susara/vlazni"){
    vlazni = v;
    document.getElementById("vlazni").innerHTML = v.toFixed(1) + " °C";
  }

  if(topic==="susara/delta"){
    document.getElementById("delta").innerHTML = v.toFixed(1) + " °C";
    updateAnimation(v);
  }

});

</script>

</body>
</html>
